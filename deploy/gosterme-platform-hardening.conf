# Install as:
# /etc/systemd/system/gosterme.service.d/platform-hardening.conf

[Service]
ExecStart=
ExecStart=/opt/goster.me/.venv/bin/python /opt/goster.me/platform_app.py

Environment=GOSTER_SANDBOX_ORIGIN=https://s.goster.me

MemoryHigh=192M
MemoryMax=256M
TasksMax=64
LimitNOFILE=512
CPUQuota=100%

UMask=0027
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
CapabilityBoundingSet=
AmbientCapabilities=
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
